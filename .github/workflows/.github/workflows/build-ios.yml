name: Build NSS-VET iOS Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS App on Cloud Mac
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build iOS Application (Simulator Build)
        run: |
          # Recherche automatique du fichier .xcodeproj (à la racine ou dans le sous-dossier IOS)
          if [ -d "NSSVet.xcodeproj" ]; then
            PROJECT_PATH="NSSVet.xcodeproj"
          elif [ -d "IOS/NSSVet.xcodeproj" ]; then
            PROJECT_PATH="IOS/NSSVet.xcodeproj"
          else
            PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          fi
          echo "Building Xcode project at: $PROJECT_PATH"
          
          xcodebuild -project "$PROJECT_PATH" \
                     -scheme NSSVet \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package App for Distribution / Download
        run: |
          mkdir -p output
          APP_PATH=$(find build -name "NSSVet.app" | head -n 1)
          echo "App path found: $APP_PATH"
          cd $(dirname "$APP_PATH")
          zip -r ../../../../output/NSSVet-iOS-App.zip NSSVet.app

      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSSVet-iOS-App-Binary
          path: output/NSSVet-iOS-App.zip
